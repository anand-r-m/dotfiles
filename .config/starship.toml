add_newline = true
format = "$directory$git_branch$git_status$java$python$nodejs$cmd_duration$line_break$character"

[directory]
style = "bold blue"
truncation_length = 3

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "purple"

[java]
symbol = " "
style = "cyan"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "dimmed white"

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"

general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Everything below only happens on battery

listener {
  timeout = 240
  on-timeout = /home/anand-r-m/.local/bin/on-battery && brightnessctl -s set 10%
  on-resume = brightnessctl -r
}

listener {
  timeout = 300
  on-timeout = /home/anand-r-m/.local/bin/on-battery && loginctl lock-session
}

listener {
  timeout = 330
  on-timeout = /home/anand-r-m/.local/bin/on-battery && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
  timeout = 900
  on-timeout = /home/anand-r-m/.local/bin/suspend-if-battery
}

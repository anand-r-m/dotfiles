general {
  hide_cursor = true
}

background {
  monitor =
  path = {{image}}
  blur_passes = 3
  blur_size = 8
  brightness = 0.6
}

label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  font_size = 110
  font_family = JetBrainsMono Nerd Font Bold
  color = rgb({{colors.primary.default.hex_stripped}})
  position = 0, 200
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B"
  font_size = 20
  font_family = JetBrainsMono Nerd Font
  color = rgb({{colors.on_surface.default.hex_stripped}})
  position = 0, 90
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 380, 60
  outline_thickness = 2
  rounding = -1
  outer_color = rgb({{colors.primary.default.hex_stripped}})
  inner_color = rgba({{colors.surface_container.default.hex_stripped}}dd)
  font_color = rgb({{colors.on_surface.default.hex_stripped}})
  check_color = rgb({{colors.tertiary.default.hex_stripped}})
  fail_color = rgb({{colors.error.default.hex_stripped}})
  placeholder_text = Password
  fail_text = Wrong password
  dots_center = true
  font_family = JetBrainsMono Nerd Font
  fade_on_empty = false
  position = 0, -40
  halign = center
  valign = center
}
